<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tramposo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        /* Vibrant Gradient Background */
        background-color: #f3e8ff; /* Fallback */
        background-image: linear-gradient(160deg, #f5f3ff 0%, #d8b4fe 100%);
        transition: background-image 0.3s ease-in-out;
      }
      .dark body {
        background-color: #1e1b4b; /* Fallback */
        background-image: linear-gradient(160deg, #1e1b4b 0%, #312e81 100%);
      }
      .font-orbitron {
        font-family: 'Orbitron', sans-serif;
      }
      .text-gradient {
        background-image: linear-gradient(to right, #a855f7, #ef4444);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .dark .text-gradient {
        background-image: linear-gradient(to right, #c084fc, #f87171);
      }
      @keyframes confetti-fall {
        0% {
          transform: translateY(0vh) rotateZ(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(105vh) rotateZ(720deg);
          opacity: 0;
        }
      }
      .confetti-piece {
        position: absolute;
        top: -20px;
        animation-name: confetti-fall;
        animation-timing-function: linear;
        animation-iteration-count: 1;
        will-change: transform, opacity;
      }
      @keyframes tension-pulse {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .tension-bg {
        background: radial-gradient(circle at center, rgba(244, 63, 94, 0.05) 0%, rgba(244, 63, 94, 0) 70%);
        background-size: 200% 200%;
        animation: tension-pulse 8s ease-in-out infinite;
      }
      .dark .tension-bg {
        background: radial-gradient(circle at center, rgba(244, 63, 94, 0.1) 0%, rgba(244, 63, 94, 0) 70%);
      }

      /* Entrance Animations */
      @keyframes fade-in-down {
          from { opacity: 0; transform: translateY(-10px); }
          to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-down { animation: fade-in-down 0.4s ease-out both; }

      @keyframes scale-in {
          from { opacity: 0; transform: scale(0.9); }
          to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in { animation: scale-in 0.4s ease-out both; }

      @keyframes fade-in-up {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fade-in-up 0.4s ease-out both; }

      /* Exit Animations */
      @keyframes fade-out-up {
          from { opacity: 1; transform: translateY(0); }
          to { opacity: 0; transform: translateY(-10px); }
      }
      .animate-fade-out-up { animation: fade-out-up 0.3s ease-in both; }

      @keyframes scale-out {
          from { opacity: 1; transform: scale(1); }
          to { opacity: 0; transform: scale(0.9); }
      }
      .animate-scale-out { animation: scale-out 0.3s ease-in both; }

      @keyframes fade-out-down {
          from { opacity: 1; transform: translateY(0); }
          to { opacity: 0; transform: translateY(10px); }
      }
      .animate-fade-out-down { animation: fade-out-down 0.3s ease-in both; }
    </style>
    <script>
      // On page load or when changing themes, best to add inline in `head` to avoid FOUC
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",

    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1"
  }
}
</script>

</head>
